version: '3.8'

services:
  hubspot-mcp-server:
    # Use published image (recommended)
    image: ghcr.io/sanketskasar/hubspot-mcp-server:latest
    # Alternative: image: sanketskasar/hubspot-mcp-server:latest
    
    # Uncomment to build locally instead of using published image
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: production
    
    container_name: hubspot-mcp-server
    restart: always
    
    ports:
      - "3000:3000"
    
    environment:
      # Required - HubSpot Private App Access Token
      HUBSPOT_PRIVATE_APP_ACCESS_TOKEN: ""
      
      # Server Configuration
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      
      # Application Settings
      APP_NAME: hubspot-mcp-server
      APP_VERSION: 1.0.0
      LOG_LEVEL: info
      
      # HubSpot API Configuration
      HUBSPOT_API_URL: https://api.hubapi.com
      
      # Security & Performance
      CORS_ORIGIN: localhost
      MAX_REQUEST_SIZE: 10485760
      GRACEFUL_SHUTDOWN_TIMEOUT: 10000
      NODE_OPTIONS: "--max-old-space-size=512"
      
      # System
      TZ: UTC
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Security hardening (optional)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /run:noexec,nosuid,size=50m

# Usage:
#   1. Set HUBSPOT_PRIVATE_APP_ACCESS_TOKEN in environment section above
#   2. Run: docker-compose up -d
#   3. Access: http://localhost:3000/health
#   4. Stop: docker-compose down